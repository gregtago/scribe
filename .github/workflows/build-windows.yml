name: Build Scribe (installeur Windows)

# Fabrique l'installeur .exe autonome (service + Tesseract + Ghostscript).
# Se lance manuellement, ou à chaque push.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publier une release (ex. v1.0.0). Laisser vide = simple build."
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]        # un tag vX.Y.Z publie une release permanente

permissions:
  contents: write        # nécessaire pour créer la release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python (+ PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests de non-régression (ressources)
        run: |
          # Vérifie notamment qu'un PDF dont seule la date de modification a
          # changé (synchronisation OneDrive) ne repart pas à l'OCR, et que le
          # parallélisme reste borné. Moteur OCR simulé : quelques secondes.
          python tests/test_ressources.py

      - name: Compiler le service (PyInstaller)
        run: pyinstaller --noconfirm --workpath dist/_pyiwork build/scribe.spec

      - name: Compiler l'app de la barre des tâches (PyInstaller)
        run: pyinstaller --noconfirm --workpath dist/_pyiwork build/scribe-tray.spec

      - name: Vérifier que le service démarre réellement
        timeout-minutes: 3
        run: |
          # Lance l'exe gelé : --init-config exerce tout le chargement du
          # paquet 'scribe' (et watchdog) sans dépendre des moteurs OCR.
          # Échoue si le paquet n'est pas embarqué (ModuleNotFoundError).
          $exe = "dist/scribe/scribe.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable introuvable : $exe" }
          Remove-Item "$env:ProgramData\Scribe\config.toml" -ErrorAction SilentlyContinue
          Start-Process -FilePath $exe -ArgumentList "--init-config","$env:TEMP\scribe-selftest" -Wait -PassThru | Out-Null
          if (-not (Test-Path "$env:ProgramData\Scribe\config.toml")) {
            throw "scribe.exe n'a pas généré la configuration : le paquet 'scribe' n'est pas embarqué correctement."
          }
          Write-Host "OK : scribe.exe démarre et génère sa configuration."

      - name: Vérifier que l'app barre des tâches est bien empaquetée
        run: |
          $exe = "dist/scribe-tray/scribe-tray.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable introuvable : $exe" }
          Write-Host "OK : scribe-tray.exe présent."

      - name: Installer les moteurs OCR (Tesseract, Ghostscript, NSSM)
        timeout-minutes: 20
        run: |
          # Deux aléas connus sur les runners, qui échouaient tous deux mal :
          #
          #   - le dépôt communautaire Chocolatey renvoie régulièrement 503
          #     (Service Unavailable) ; « choco install » peut alors sortir en
          #     code 0 après n'avoir RIEN installé ;
          #   - l'installeur silencieux de Ghostscript crashe parfois (access
          #     violation, code -1073741819).
          #
          # Seul Ghostscript était protégé par une reprise. Un échec sur
          # Tesseract passait inaperçu — l'étape était réputée réussie — et ne
          # se manifestait que bien plus loin, dans fetch-vendor.ps1, sous la
          # forme trompeuse « Tesseract introuvable ». On vérifie donc la
          # présence RÉELLE de chaque moteur après chaque tentative, aux mêmes
          # emplacements que ceux attendus par fetch-vendor.ps1.
          function Install-Moteur {
            param([string]$Nom, [scriptblock]$Present, [switch]$Forcer)
            for ($i = 1; $i -le 5; $i++) {
              if ($Forcer) { choco install $Nom --no-progress -y --force }
              else         { choco install $Nom --no-progress -y }
              if ($LASTEXITCODE -eq 0 -and (& $Present)) {
                Write-Host "$Nom : présent (tentative $i)."
                return
              }
              Write-Host "$Nom : tentative $i infructueuse (code $LASTEXITCODE), nouvel essai dans 20 s…"
              Start-Sleep -Seconds 20
            }
            throw "$Nom n'a pas pu être installé après 5 tentatives (dépôt Chocolatey indisponible ?)."
          }

          Install-Moteur -Nom tesseract -Present {
            Test-Path "C:\Program Files\Tesseract-OCR\tesseract.exe"
          }
          Install-Moteur -Nom nssm -Present {
            [bool](Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter nssm.exe `
                     -ErrorAction SilentlyContinue |
                   Where-Object { $_.Length -ge 100000 } | Select-Object -First 1)
          }
          Install-Moteur -Nom ghostscript -Forcer -Present {
            [bool](Get-ChildItem "C:\Program Files\gs" -Directory `
                     -ErrorAction SilentlyContinue | Select-Object -First 1)
          }

          # Rafraîchit le PATH pour la même session PowerShell.
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment

      - name: Préparer le dossier vendor
        run: powershell -ExecutionPolicy Bypass -File build/fetch-vendor.ps1

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installeur
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "build\installer.iss"

      - name: Vérifier l'installation complète (service créé, démarré, état publié)
        timeout-minutes: 6
        run: |
          # Installe RÉELLEMENT l'installeur en silencieux sur ce runner propre,
          # puis vérifie que le service est créé, démarre et publie son état.
          # C'est ce test qui manquait : il attrape les problèmes de service
          # (ex. nssm shim) que la simple compilation ne voit pas.
          $exe = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          Write-Host "Installation silencieuse de $($exe.Name)…"
          Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 6

          $svc = Get-Service Scribe -ErrorAction SilentlyContinue
          if (-not $svc) { throw "ÉCHEC : le service 'Scribe' n'a pas été créé par l'installeur." }
          Write-Host "Service 'Scribe' présent — état : $($svc.Status)"

          if (-not (Test-Path "$env:ProgramData\Scribe\status.json")) {
            Write-Host "--- service-err.log ---"
            Get-Content "$env:ProgramData\Scribe\service-err.log" -Tail 30 -ErrorAction SilentlyContinue
            throw "ÉCHEC : le service ne publie pas status.json (il ne tourne pas)."
          }
          Write-Host "OK : service créé, démarré et status.json publié."

      - name: Test OCR réel avec le moteur français EMBARQUÉ (bout en bout)
        timeout-minutes: 6
        run: |
          # Utilise l'exe INSTALLÉ (C:\Program Files\Scribe) : il embarque son
          # propre Tesseract avec le français (tessdata_best/fra), contrairement
          # au Tesseract système du runner. Océrise un vrai PDF et vérifie la
          # couche texte -> valide l'appel OCR + la présence du français.
          $work = Join-Path $env:TEMP "ocrtest"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $pdf = Join-Path $work "scan.pdf"
          python build/make_test_pdf.py "$pdf"
          $wd = $work -replace '\\','/'
          "watch_dir = `"$wd`"`nrescan_seconds = 0`nstable_seconds = 0" |
            Out-File -Encoding utf8 (Join-Path $work "config.toml")
          Start-Process -FilePath "C:\Program Files\Scribe\scribe.exe" `
            -ArgumentList (Join-Path $work "config.toml"), "--once" -Wait
          $txt = python -c "from pdfminer.high_level import extract_text; print(extract_text(r'$pdf'))"
          Write-Host "Texte extrait du PDF : '$txt'"
          if (-not ($txt -match '\w')) {
            Write-Host "--- scribe.log ---"
            Get-Content "$env:ProgramData\Scribe\scribe.log" -Tail 25 -ErrorAction SilentlyContinue
            throw "ECHEC : aucun texte extrait, l'OCR (francais embarque) n'a pas fonctionne."
          }
          Write-Host "OK : OCR francais embarque fonctionnel, couche texte produite."

      - name: Publier l'installeur (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: Scribe-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Déterminer la version de release
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '')
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.ref }}" -eq "refs/heads/release") {
            $tag = (Get-Content VERSION -Raw).Trim()   # version publiée depuis la branche release
          } else {
            $tag = "${{ github.event.inputs.release_version }}"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publier la release (tag vX.Y.Z ou lancement manuel avec version)
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Scribe ${{ steps.rel.outputs.tag }}
          body_path: CHANGELOG.md
          files: dist/installer/*.exe
          draft: false
          prerelease: false
